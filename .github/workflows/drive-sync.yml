name: Drive sync

on:
  schedule:
    # Todos los días a las 09:00 UTC.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
      # Se puede sobreescribir con la variable de repositorio DRIVE_FOLDER_ID.
      DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID || '1Tw6mHgEgSyUefrPzMQVwudSUhz7Y3N8J' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-drive-sync.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-drive-sync.txt

      - name: Sync Drive folder
        id: sync
        shell: bash
        run: |
          set -o pipefail
          python scripts/drive_sync.py --folder-id "$DRIVE_FOLDER_ID" | tee /tmp/drive-sync.log
          NEW=$(grep -oP 'NEW_FILES=\K[0-9]+' /tmp/drive-sync.log | tail -1 || true)
          echo "new_files=${NEW:-0}" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p image/drive
          git config user.name "moekat drive sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/drive-manifest.json image/drive
          if git diff --cached --quiet; then
            echo "Sin cambios: no se crea commit."
            exit 0
          fi
          git commit -m "Drive sync: ${{ steps.sync.outputs.new_files }} new files"
          git push
