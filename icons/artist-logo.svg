<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="orbBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#b8fff6"/>
      <stop offset="40%" stop-color="#3cd0d8"/>
      <stop offset="78%" stop-color="#1b74c7"/>
      <stop offset="100%" stop-color="#0d3c7a"/>
    </radialGradient>
    <linearGradient id="orbGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="paletteGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#e3d2b4"/>
    </linearGradient>
    <filter id="drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#06224a" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Outer Aqua Glass Orb -->
  <circle cx="64" cy="64" r="58" fill="url(#orbBg)" stroke="#ffffff" stroke-width="3" filter="url(#drop)"/>
  <!-- Inner Rim Glow -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#a6f7ff" stroke-opacity="0.55" stroke-width="2"/>
  <!-- Artist Palette -->
  <path d="M38,67 C34,47 50,34 69,36 C86,38 96,51 92,66 C89,75 80,75 76,81 C73,86 78,92 70,95 C52,98 41,85 38,67 Z" fill="url(#paletteGrad)" stroke="#9e8768" stroke-width="2" filter="url(#drop)"/>
  <!-- Thumb hole -->
  <circle cx="52" cy="77" r="6" fill="#1b74c7" stroke="#9e8768" stroke-width="1.5"/>
  <!-- Paint dabs -->
  <circle cx="51" cy="52" r="5.5" fill="#ff4d6d"/>
  <circle cx="66" cy="46" r="5.5" fill="#ffd166"/>
  <circle cx="80" cy="53" r="5.5" fill="#06d6a0"/>
  <circle cx="82" cy="66" r="5" fill="#4cc9f0"/>
  <!-- Brush -->
  <path d="M84,26 L94,34 L69,68 L62,62 Z" fill="#ffb703" stroke="#7f4f24" stroke-width="1.5"/>
  <path d="M62,62 L69,68 L57,76 Z" fill="#6d4c41"/>
  <path d="M57,76 L62,72 L59,78 Z" fill="#e63946"/>
  <!-- Top Frutiger Aero Glass Gloss -->
  <ellipse cx="64" cy="36" rx="42" ry="23" fill="url(#orbGloss)"/>
</svg>

